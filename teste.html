<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste do iPad</title>
</head>
<body style="background:#ffd400;color:#000;font-family:Helvetica,Arial,sans-serif;padding:30px;font-size:24px;">
<h1 style="font-size:40px;margin:0 0 20px">1. A página abriu ✔</h1>
<p id="js" style="font-size:30px;color:#b00000">2. JavaScript: NÃO rodou ✘</p>
<p id="ua" style="font-size:16px;"></p>
<p id="ls" style="font-size:20px;"></p>
<p><a href="./" style="font-size:28px;color:#0033cc">Abrir o painel →</a></p>
<script>
document.getElementById('js').innerHTML = '2. JavaScript: funcionando ✔';
document.getElementById('js').style.color = '#006b1b';
document.getElementById('ua').innerHTML = 'Navegador: ' + navigator.userAgent + '<br>Modo tela inicial: ' + (window.navigator.standalone ? 'sim' : 'não');
try { localStorage.setItem('t', '1'); document.getElementById('ls').innerHTML = '3. Memória do navegador: ok ✔'; }
catch (e) { document.getElementById('ls').innerHTML = '3. Memória do navegador: bloqueada (navegação privada?)'; }
</script>
</body>
</html>
